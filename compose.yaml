services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petcare}
      MYSQL_USER: ${MYSQL_USER:-petcare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-petcare}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      DB_USERNAME: ${MYSQL_USER:-petcare}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      PETCARE_BENEFITS_PREVIEW: ${PETCARE_BENEFITS_PREVIEW:-true}
      REVENUECAT_ENABLED: ${REVENUECAT_ENABLED:-false}
      REVENUECAT_SANDBOX: ${REVENUECAT_SANDBOX:-false}
      REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:-}
      REVENUECAT_WEBHOOK_AUTHORIZATION: ${REVENUECAT_WEBHOOK_AUTHORIZATION:-}
      REVENUECAT_APP_ID: ${REVENUECAT_APP_ID:-}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-family_plus}
      REVENUECAT_OFFERING_ID: ${REVENUECAT_OFFERING_ID:-default}
      REVENUECAT_PRODUCTS: ${REVENUECAT_PRODUCTS:-}
      REVENUECAT_STORAGE_BYTES: ${REVENUECAT_STORAGE_BYTES:-1073741824}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      PETCARE_MAIL_FROM: ${PETCARE_MAIL_FROM:-}
      PETCARE_MAIL_PROVIDER: ${PETCARE_MAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PETCARE_PUSH_ENABLED: ${PETCARE_PUSH_ENABLED:-false}
      PETCARE_PUSH_CREDENTIALS_FILE: ${PETCARE_PUSH_CREDENTIALS_FILE:-}
    volumes:
      - ./.local/push:/run/secrets/petcare-push:ro
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
