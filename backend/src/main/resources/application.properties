spring.application.name=petcare
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:13316/petcare?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:petcare}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Keep MySQL TIMESTAMP storage consistent with JDBC connectionTimeZone=UTC.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# Authentication bodies and bearer responses must not appear in debug logs.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO

# Set SMTP host through SPRING_MAIL_HOST; never commit credentials.
petcare.mail.provider=${PETCARE_MAIL_PROVIDER:resend}
petcare.mail.resend-api-key=${RESEND_API_KEY:}
petcare.mail.from=${PETCARE_MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
petcare.apple.client-id=${APPLE_CLIENT_ID:}
petcare.benefits.free-bytes=${PETCARE_FREE_STORAGE_BYTES:104857600}
petcare.benefits.preview-bytes=${PETCARE_PREVIEW_STORAGE_BYTES:1073741824}
petcare.benefits.preview-enabled=${PETCARE_BENEFITS_PREVIEW:true}

# Google Play / RevenueCat. Disabled until merchant and store configuration is ready.
petcare.billing.enabled=${REVENUECAT_ENABLED:false}
petcare.billing.sandbox=${REVENUECAT_SANDBOX:false}
petcare.billing.api-key=${REVENUECAT_SECRET_API_KEY:}
petcare.billing.webhook-authorization=${REVENUECAT_WEBHOOK_AUTHORIZATION:}
petcare.billing.entitlement=${REVENUECAT_ENTITLEMENT_ID:family_plus}
petcare.billing.offering=${REVENUECAT_OFFERING_ID:default}
petcare.billing.app-id=${REVENUECAT_APP_ID:}
petcare.billing.products=${REVENUECAT_PRODUCTS:}
petcare.billing.storage-bytes=${REVENUECAT_STORAGE_BYTES:1073741824}

# FCM HTTP v1; Firebase relays iOS background messages through APNs.
petcare.push.enabled=${PETCARE_PUSH_ENABLED:false}
petcare.push.credentials-file=${PETCARE_PUSH_CREDENTIALS_FILE:}
