spring.application.name=petcare
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:13316/petcare?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:petcare}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Keep MySQL TIMESTAMP storage consistent with JDBC connectionTimeZone=UTC.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# Authentication bodies and bearer responses must not appear in debug logs.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO

# Set SMTP host through SPRING_MAIL_HOST; never commit credentials.
petcare.mail.from=${PETCARE_MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
petcare.apple.client-id=${APPLE_CLIENT_ID:}
